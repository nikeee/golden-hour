name: CD

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency: prod

jobs:
  build:
    runs-on: ubuntu-slim
    name: Build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm

      - run: npm ci --no-audit
      - run: node --run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-slim
    name: Deploy

    permissions:
      pages: write
      id-token: write
      actions: read

    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
